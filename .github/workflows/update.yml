
name: Update IPTV logo index

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-logo-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build logo index
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: |
          test -n "$M3U_URL" || (echo "Missing repository Actions secret: M3U_URL" && exit 1)
          python -u build_index.py

      - name: Check generated index
        run: |
          test -s logos-map.json
          python -m json.tool logos-map.json > /dev/null

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-map.json logo-check-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update logo index"
            git push
          else
            echo "No index changes."
          fi
