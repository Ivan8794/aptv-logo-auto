name: Build and deploy EPG logo library

on:
  schedule:
    - cron: "15 */8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "build_epg_logo_site.py"
      - ".github/workflows/deploy-logo-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image conversion dependencies
        run: pip install Pillow CairoSVG
      - name: Generate EPG logos
        run: python -u build_epg_logo_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
